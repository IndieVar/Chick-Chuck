# Home page
he:
    about:
        header:
            title:            "הרעיון הוא ליצור שירות"
            desc:             "שלום, שמי אלכסנדר ואני המייסד של Relomio. אחרי המעבר לישראל, הניסיון האישי שלי ושל האנשים סביבי הראה לי עד כמה מעבר דירה תכוף יכול להיות מאתגר. ראיתי כמה חברות הובלה פועלות בישראל ועד כמה אנשים זקוקים לדרך אמינה לבחור ביניהן. כך נולד הרעיון לרכז את המובילים במקום אחד, להקל על מציאת השירות המתאים ולאפשר בחירה בטוחה יותר בעזרת דירוגים וחוות דעת אמיתיים. Relomio גם עוזרת למצוא פריטים שימושיים מיד שנייה לקראת הבית החדש. בהמשך אספר לכם עוד על השירות."
            founder_name:     "אלכסנדר ורלאמוב"
            founder_title:    "מייסד Relomio"
        calculator:
            title:            "חישוב ראשוני של עלות המעבר"
            desc_html:        "חשוב להביא בחשבון את העבודה הפיזית הקשה של הסבלים ואת עלויות הדלק בהובלת החפצים שלכם. לכן השירות מאפשר למוביל לציין את עלות הנסיעה ואת עלות הובלת פריטים מקטגוריות שונות, וכן את התשלום עבור כל קומה שעולים או יורדים בה. <br> מעבר דירה הוא תהליך מורכב ויקר. מחשבון ההובלות מאפשר לקבל הערכה ראשונית של עלות המעבר מחברות הרשומות בשירות שלנו. אי אפשר לחשב את כל הפרטים בלי להכיר את המקרה באופן אישי, ולכן העלות הראשונית היא משוערת. העלות המדויקת תיקבע ישירות מול המוביל."
        carriers:
            title:            "דירוגים וחוות דעת אמיתיים"
            desc_html:        "תוכלו לבחור מוביל לפי האזור וחוות הדעת האמיתיות על החברה, וגם לדרג את שירותיו על סמך הניסיון שלכם."
        market:
            title:            "אפשרות לקנות ולמכור פריטי יד שנייה"
            desc_html:        "כל משתמש רשום יכול לפרסם מודעה למכירת פריטי יד שנייה ולציין את האזור, את מצב הפריט ואת הקטגוריה שלו. <br> תוכלו גם לקנות פריטי יד שנייה ישירות ממוביל. זה נוח במיוחד, כי מובילים מכירים היטב את התחום ואפשר לתאם איתם את המשלוח ישירות."
        moving_preparation:
            title:            "הכנה למעבר דירה"
            desc_html:        "אם עדיין לא עברתם דירה או שאין לכם ניסיון רב בתהליך המורכב הזה, קראו את המאמר שלנו על הכנה למעבר. הוא יעזור לכם לתכנן אותו בקפידה ולהרגיש בטוחים יותר."
        statistics:
            title:            "Relomio במספרים"
    