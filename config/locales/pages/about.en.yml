en:
    about:
        header:
            title:            "The idea behind the service"
            desc:             "Hello, my name is Alexander. I am the founder and creator of Relomio. After moving to Israel, I experienced firsthand how challenging frequent moves within the country can be, as did the people around me. I noticed how many movers there are in Israel and how much demand there is for their services. I realized it would be useful to bring movers together on one website, making it easier to find one based on each customer's needs—and, most importantly, on real ratings and customer reviews—so people can avoid unreliable movers and have a good moving experience. People who don't own a home and have to keep moving from one rented apartment to another understand what I mean. Below, I'll tell you a little about my service."
            founder_name:     "Aleksandr Varlamov"
            founder_title:    "Founder of Relomio"
        calculator:
            title:            "Preliminary moving cost estimate"
            desc_html:        "The hard physical work of movers and the cost of fuel are significant parts of a move. Our service lets movers specify their rates for distance traveled and for carrying items in different categories on each floor, up or down. <br> Moving is difficult and expensive, so our cost calculator helps you get a preliminary estimate from companies registered with our service. Not every detail can be accounted for without an in-person assessment, so the estimate is approximate; the final cost is agreed directly with the mover."
        carriers:
            title:            "Real ratings and reviews"
            desc_html:        "Choose a mover in your area based on genuine reviews of the company, and rate the mover's services based on your own experience."
        market:
            title:            "Buy and sell second-hand items"
            desc_html:        "Any registered user can post an ad to sell second-hand items, specifying their location and category. <br> You can also buy second-hand items directly from a mover, which is convenient: movers know a thing or two about used goods, and you can arrange delivery with them directly."
        moving_preparation:
            title:            "Preparation for relocation"
            desc_html:        "If you have never moved to another apartment or have little experience with it, read our article on preparing for a move to plan ahead and feel more confident."
        statistics:
            title:            "Relomio in numbers"
    