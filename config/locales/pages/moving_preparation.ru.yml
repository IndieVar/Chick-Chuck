# Moving preparation
ru:  
    moving_preparation:
        title:        'Подготовка к переезду'
        list:         'Оглавление: '
        header:       'Переехать в новый дом — значит начать новую жизнь. Однако есть мнение, что проще пережить два пожара, чем один переезд. Но если все тщательно спланировать и заранее подготовиться, переезд пройдет быстро, четко и даже принесет удовольствие. Рассказываем, как подготовиться к самостоятельному переезду и ничего не упустить.'
        #
        content_1_t:  'Избавиться от ненужного'
        content_1_c:  'Отличная возможность устроить глобальную ревизию вещей, мебели и техники. Критически оцените нажитое и подумайте, что действительно нужно, а что нет. Золотое правило: если вы не пользовались вещью больше года, вряд ли она вообще понадобится. Если вещи в хорошем состоянии, но в вашей новой жизни им нет места, их можно обменять, отдать на переработку или благотворительность либо продать, устроив «гаражную распродажу» или разместив объявление на специальном сайте. Многие магазины также принимают обратно купленную у них мебель и технику и платят за это. В крайнем случае вещи можно выбросить. Иначе вы переплатите за перевозку мусора.'
        #
        content_2_t:  'Измерить мебель и технику'
        content_2_c:  'Измерьте рулеткой всю крупногабаритную технику и мебель, которую заберете с собой: так вы оцените объем перевозки и убедитесь, что громоздкий рояль или огромная двуспальная кровать пройдут в дверные проемы новой квартиры.'
        #
        content_3_t:  'Составить план расстановки'
        content_3_c:  'Составьте примерный план расстановки техники и мебели в новой квартире. Так вам не придется несколько раз перетаскивать крупные предметы из одной комнаты в другую и спотыкаться о бесчисленные коробки.'
        #
        content_4_t:  'Найти подходящего перевозчика на нашем сайте'
        content_4_c:  'После того как вы оценили объем вещей, которые нужно перевезти, можно искать компанию, которая займется грузоперевозками. Стоимость будет зависеть от времени, затраченного на работу, и количества необходимых грузчиков. Всегда лучше выбирать проверенную компанию. Почитайте отзывы и не забывайте оставить собственный отзыв об услугах перевозчика: это поможет другим людям найти добросовестную и профессиональную компанию, как когда-то помогли вам. Заранее сообщите перевозчику все детали: дату, время, расстояние между районами, этаж, наличие грузового лифта и габариты вещей — так вы узнаете точную стоимость услуг и сможете избежать неприятных сюрпризов. Заключите договор и внимательно ознакомьтесь с условиями работы компании: какую ответственность она берет на себя за сохранность вещей, соблюдение сроков и порчу имущества.'
        #
        content_5_t:  'Разобраться с квитанциями и счетами по старому адресу'
        content_5_c:  'Въезжайте в новую квартиру, как и в новый год, без долгов. Перед переездом проверьте, оплачены ли счета за коммунальные услуги, запишите или сфотографируйте показания счетчиков. Также заранее решите вопрос с интернетом и телевидением: расторгнете ли вы договор, перенесете услуги провайдера на новый адрес или передадите их будущим жильцам. Попрощайтесь с соседями и по возможности оставьте свои контакты на случай, если кто-то будет искать вас по старому адресу.'
        #
        content_6_t:  'Собрать и упаковать вещи'
        content_6_c:  'Важно не забыть об упаковочных материалах — их должно быть в избытке. Лучше пусть часть материалов останется, чем в последние минуты придется искать замену или рисковать сохранностью вещей. Хрупкие вещи защитит обычная и пузырчатая пленка, одежду можно перевозить в специальных кофрах. Картонные коробки и листы закажите в интернете или попросите в мебельных и продуктовых магазинах. Также вам понадобятся веревка, скотч, маркеры для маркировки, мусорные мешки, нож и ножницы. Не откладывайте упаковку вещей на последние дни. Начинайте с того, что не понадобится «здесь и сейчас»: мелкой техники, книг, новогодних игрушек. Если переезжаете летом, начните с упаковки зимней одежды и обуви, а в холодное время года — наоборот. Так за пару дней до переезда будет упакована большая часть вещей. Подпишите коробки и наклейте стикеры, например: «Текстиль. Спальня», «Одежда. Детская». Это поможет и грузчикам, и вам при разборе вещей. Детали разобранной мебели складывайте в отдельные коробки вместе с крепежом, а туда же положите инструкции по сборке.'
        #
        content_7_t:  'Подготовить новую квартиру'
        content_7_c:  'Перед заездом в новую квартиру наведите в ней порядок. Убираться придется и после, но делать все с нуля среди коробок и мешков будет сложнее. Защитите дверные откосы картоном, а полы накройте защитной пленкой. Также заранее проверьте все коммуникации: работают ли розетки, включается ли свет, есть ли вода. Проверьте работу грузовых лифтов, познакомьтесь с консьержем, прогуляйтесь по району — вдруг срочно понадобится хозяйственный магазин или аптека. Это значительно облегчит первые несколько часов жизни на новом месте.'
        #
        content_8_t:  'Навести порядок в старой квартире'
        content_8_c:  'Вам наверняка приятно заезжать в чистую квартиру, поэтому и после себя оставьте порядок. Возможно, придется сделать мелкий косметический ремонт — подклеить обои или заменить плинтус. Можно вызвать клининговую компанию и оставить ключи консьержу.'
        #
        content_9_t:  'Позаботиться о детях и домашних животных'
        content_9_c:  'Если у вас есть маленькие дети или животные, заранее подумайте, как они переживут переезд. Для них это будет большим стрессом, а для вас — дополнительными заботами и переживаниями. Возможно, детей лучше на пару дней отправить в гости к дедушкам и бабушкам, а животных временно оставить у друзей или на платной передержке.'
        #
        content_10_t: 'Собрать необходимый минимум'
        content_10_c: 'Отдельно соберите сумку или рюкзак с вещами, которые понадобятся в день переезда: одеждой и обувью, документами, зарядными устройствами, аптечкой, туалетными принадлежностями, посудой первой необходимости и бытовой химией. Возьмите с собой еду для перекуса и воду, при необходимости положив их в термосумку.'
        #
        footer:       'Ура! Выдыхайте, запускайте в дом кошку и готовьтесь к новоселью 🥳'
