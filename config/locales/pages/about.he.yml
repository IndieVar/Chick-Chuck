# Home page
he:
    about:
        header:
            title:            "הרעיון שמאחורי השירות"
            desc:             "שלום, שמי אלכסנדר ואני מייסד השירות Chick-Chuck.com. אחרי שעברתי לישראל, חוויתי בעצמי, וגם דרך האנשים סביבי, את הצורך לעבור דירה לעיתים קרובות בתוך המדינה. שמתי לב שיש בישראל מובילים רבים, ושיש ביקוש רב לשירותיהם. הבנתי שכדאי לרכז את כל המובילים באתר אחד, כדי להקל על החיפוש לפי הקריטריונים החשובים ללקוחות — ובעיקר לפי דירוגים וחוות דעת אמיתיים. כך אפשר להימנע ממובילים לא אמינים ולהפוך את המעבר לנוח יותר. מי שאין להם דירה משלהם ונאלצים לעבור שוב ושוב מדירה שכורה אחת לאחרת מבינים על מה אני מדבר. בהמשך אספר לכם עוד קצת על השירות שלי."
            founder_name:     "אלכסנדר ורלאמוב"
            founder_title:    "מייסד Chick-Chuck.com"
        calculator:
            title:            "הערכה ראשונית של עלות המעבר"
            desc_html:        "אי אפשר להמעיט בערכם של העבודה הפיזית הקשה של הסבלים ושל הוצאות הדלק בהובלת חפצים. לכן השירות מאפשר למוביל לציין את עלות ההובלה למרחק מסוים, וכן את עלות העלאת החפצים והורדתם, בהתאם לקטגוריה שלהם ולקומה. <br> מעבר דירה הוא עניין לא פשוט ויקר. המחשבון מאפשר ללקוחות להעריך את עלות המעבר אצל החברות הרשומות בשירות שלנו. אי אפשר להביא בחשבון את כל פרטי המעבר בלי לבדוק אותם באופן אישי, ולכן מדובר בהערכה בלבד. יש לתאם את העלות המדויקת ישירות עם המוביל."
        carriers:
            title:            "דירוגים וחוות דעת אמיתיים"
            desc_html:        "בחרו מוביל לפי האזור ולפי חוות דעת אמיתיות על החברה, ודרגו את שירותיו על סמך הניסיון שלכם."
        market:
            title:            "אפשרות לקנות ולמכור פריטי יד שנייה"
            desc_html:        "כל משתמש רשום יכול לפרסם מודעה למכירת פריטי יד שנייה ולציין את האזור, המצב והקטגוריה שלהם. <br> אפשר גם לקנות פריטי יד שנייה ישירות ממוביל. זה נוח במיוחד, כי מובילים מבינים היטב בפריטים כאלה ואפשר לתאם איתם את המשלוח ישירות."
        moving_preparation:
            title:            "הכנה למעבר דירה"
            desc_html:        "אם עדיין לא עברתם דירה או שאין לכם ניסיון רב בתהליך המורכב הזה, קראו את המאמר שלנו על הכנה למעבר. הוא יעזור לכם לתכנן אותו בקפידה ולהרגיש בטוחים יותר."
    
    