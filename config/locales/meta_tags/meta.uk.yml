uk:
    meta:
        home_page:
            title:  "Перевезення | Барахолка | Ізраїль"
            desc:   "Наш сайт пропонує зручний пошук перевізників і вживаних товарів по всьому Ізраїлю. Ви можете знайти надійних і досвідчених перевізників, які допоможуть перевезти речі в будь-яку точку країни. А ще — знайти потрібні речі за вигідною ціною або заробити на непотрібних."
        moving_preparation:
            title:  "Як підготуватися до переїзду | Ізраїль"
            desc:   "Переїхати в новий дім — означає розпочати нове життя. Розповідаємо, як підготуватися до самостійного переїзду й нічого не забути."
        carriers:
            title:  "Пошук перевізника в Ізраїлі"
            desc:   "Оберіть перевізника відповідно до вашого регіону та реальних відгуків про компанію."
        calculator:
            title:  "Розрахувати вартість перевезення | Ізраїль"
            desc:   "Калькулятор вартості перевезення дає змогу дізнатися приблизну вартість переїзду в компаніях, зареєстрованих у нашому сервісі."
        market:
            title:  "Купити/продати вживані товари | Ізраїль"
            desc:   "Будь-який зареєстрований користувач може подати оголошення про продаж вживаних речей, указавши регіон і категорію товару."
        about:
            title:  "Детальніше про сервіс"
            desc:   "Розповідаємо про ідею створення сервісу та його особливості. Залиште відгук або пропозицію, щоб допомогти нам покращити сервіс."
        feedbacks:
            title:  "Відгуки про сервіс"
            desc:   "Тут ви можете залишити свій відгук або запропонувати поліпшити сервіс. Разом ми зробимо цей сервіс кращим!"
        company:
            sign_up:
                title:  "Стати перевізником | Реєстрація компанії"
                desc:   "Зареєструйте компанію, щоб безкоштовно рекламувати її та залучати більше клієнтів!"
            sign_in:
                title:  "Увійти як перевізник"
                desc:   "Вхід до особистого кабінету перевізника."
        client:
            sign_up:
                title:  "Реєстрація користувача"
                desc:   "Створіть обліковий запис, щоб оцінювати перевізників і розміщувати оголошення про продаж своїх речей."
            sign_in:
                title:  "Вхід"
                desc:   "Вхід до особистого кабінету."
                