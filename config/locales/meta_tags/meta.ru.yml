ru:
    meta:
        home_page:
            title:  "Перевозки | Барахолка | Израиль"
            desc:   "Наш сайт предлагает удобный поиск перевозчиков и подержанных товаров по всему Израилю. Вы можете найти надежных и опытных перевозчиков, которые помогут вам доставить груз или перевезти вещи в любую точку страны. А так же найти нужные вам вещи по выгодной цене или заработать на ненужных предметах."
        moving_preparation:
            title:  "Как подготовиться к переезду | Израиль"
            desc:   "Переехать в новый дом — значит начать новую жизнь. Рассказываем, как подготовиться к самостоятельному переезду и ничего не упустить."
        carriers:
            title:  "Поиск перевозчика Израиль"
            desc:   "Выберите подходящего перевозчика с учетом региона и реальных отзывов о компании."
        calculator:
            title:  "Рассчитать стоимость перевозки | Израиль"  
            desc:   "Калькулятор стоимости перевозки позволяет клиенту узнать примерную стоимость переезда у компаний, зарегистрированных в нашем сервисе."
        market:
            title:  "Купить/продать подержанные вещи | Израиль"
            desc:   "Любой зарегистрированный пользователь может подать объявление о продаже подержанных вещей, указывая регион местоположения и категорию предмета."
        about:
            title:  "Подробнее о сервисе"
            desc:   "Рассказываю об идее создания сервиса и его особенностях. Оставьте свой отзыв или предложение для улучшения сервиса."
        feedbacks:
            title:  "Отзывы о сервисе"
            desc:   "Здесь вы можете оставить отзыв или предложение по улучшению сервиса. Вместе мы сделаем его лучше!"
        company:
            sign_up:
                title:  "Стать перевозчиком | Регистрация компании"
                desc:   "Зарегистрируйте свою компанию, чтобы получать бесплатную рекламу и привлекать больше клиентов."
            sign_in:
                title:  "Войти как перевозчик"
                desc:   "Вход в личный кабинет перевозчика."
        client:
            sign_up:
                title:  "Регистрация пользователя"
                desc:   "Создайте аккаунт, чтобы оценивать перевозчиков и подавать объявления о продаже своих вещей."
            sign_in:
                title:  "Вход"
                desc:   "Вход в личный кабинет."
                