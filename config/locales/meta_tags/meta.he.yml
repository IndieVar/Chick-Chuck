he:
    meta:
        home_page:
            title:  "הובלות | לוח יד שנייה | ישראל"
            desc:   "באתר שלנו תוכלו למצוא בקלות מובילים ומוצרים יד שנייה בכל רחבי ישראל. מצאו מובילים אמינים ומנוסים שיעזרו לכם להעביר מטען או חפצים לכל מקום בארץ, או מצאו את מה שאתם צריכים במחיר משתלם ומכרו פריטים מיותרים."
        moving_preparation:
            title:  "איך להתכונן למעבר דירה | ישראל"
            desc:   "מעבר לבית חדש הוא התחלה חדשה. נסביר איך להתכונן למעבר עצמאי בלי לפספס דבר."
        carriers:
            title:  "חיפוש מוביל בישראל"
            desc:   "בחרו מוביל מתאים לפי האזור ולפי חוות דעת אמיתיות על החברה."
        calculator:
            title:  "חישוב עלות ההובלה | ישראל"
            desc:   "מחשבון ההובלה מאפשר להעריך את עלות המעבר אצל חברות הרשומות בשירות שלנו."
        market:
            title:  "קנייה ומכירה של פריטי יד שנייה | ישראל"
            desc:   "כל משתמש רשום יכול לפרסם מודעה למכירת פריטי יד שנייה ולציין את האזור ואת הקטגוריה של הפריט."
        about:
            title:  "מידע נוסף על השירות"
            desc:   "נספר על הרעיון שמאחורי השירות ועל מאפייניו. השאירו משוב או הצעה לשיפור השירות."
        feedbacks:
            title:  "חוות דעת על השירות"
            desc:   "כאן תוכלו להשאיר חוות דעת או להציע דרכים לשיפור השירות. יחד נהפוך אותו לטוב יותר!"
        company:
            sign_up:
                title:  "הצטרפו כמובילים | רישום חברה"
                desc:   "רשמו את החברה שלכם כדי לקבל פרסום בחינם ולמשוך לקוחות נוספים."
            sign_in:
                title:  "כניסה כמוביל"
                desc:   "כניסה לאזור האישי של המוביל."
        client:
            sign_up:
                title:  "רישום משתמש"
                desc:   "צרו חשבון כדי לדרג מובילים ולפרסם מודעות למכירת החפצים שלכם."
            sign_in:
                title:  "כניסה"
                desc:   "כניסה לאזור האישי שלכם."
                