# Home page
uk:
    about:
        header:
            title:            "Ідея створення сервісу"
            desc:             "Вітаю! Мене звати Олександр, я засновник сервісу Chick-Chuck.com. Після переїзду до Ізраїлю я на власному досвіді та з досвіду близьких мені людей зрозумів, як часто доводиться переїжджати в межах країни. Я помітив, скільки в Ізраїлі перевізників і наскільки затребувані їхні послуги. Тоді я зрозумів, що було б зручно зібрати всіх перевізників на одному сайті й спростити їх пошук за критеріями, важливими для клієнта, а головне — за реальними оцінками та відгуками. Це допомогло б уникнути недобросовісних перевізників і зробити переїзд комфортнішим. Люди без власного житла, яким доводиться постійно переїжджати з однієї орендованої квартири до іншої, розуміють, про що я. Нижче я трохи розповім про свій сервіс."
            founder_name:     "Олександр Варламов"
            founder_title:    "Засновник Chick-Chuck.com"
        calculator:
            title:            "Попередній розрахунок вартості переїзду"
            desc_html:        "Не можна недооцінювати важку фізичну працю вантажників і витрати на пальне під час перевезення речей. Тому сервіс дає перевізникам змогу вказати вартість перевезення на певну відстань, а також вартість підйому й спуску речей з урахуванням їхньої категорії та поверху. <br>Переїзд — справа непроста й витратна. Калькулятор допоможе дізнатися приблизну вартість переїзду в компаніях, зареєстрованих у нашому сервісі. Без огляду на місці неможливо врахувати всі нюанси, тому точну вартість потрібно узгодити безпосередньо з перевізником."
        carriers:
            title:            "Реальні рейтинги та відгуки"
            desc_html:        "Можна обрати перевізника з урахуванням регіону та реальних відгуків про компанію, а також оцінити його послуги, поділившись власним досвідом."
        market:
            title:            "Можливість купувати й продавати вживані речі"
            desc_html:        "Будь-який зареєстрований користувач може розмістити оголошення про продаж вживаних речей, указавши регіон і категорію товару. <br>Також можна купити вживані речі безпосередньо у перевізника. Це зручно: перевізники добре знаються на таких речах, і з ними можна домовитися про доставку."
        moving_preparation:
            title:            "Підготовка до переїзду"
            desc_html:        "Якщо вам раніше не доводилося переїжджати в іншу квартиру або вам бракує досвіду в цій непростій справі, ознайомтеся з нашою статтею про підготовку до переїзду. Вона допоможе ретельніше спланувати переїзд і почуватися впевненіше."
    