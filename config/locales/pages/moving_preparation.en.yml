# Moving Preparation
en:
    moving_preparation:
        title:        'Preparing for a move'
        list:         'Contents: '
        header:       "Moving to a new home means starting a new life. They say that one move is as hard as going through two fires. But with careful planning and preparation, it can go quickly and smoothly—and even be enjoyable. Here's how to prepare for a move and make sure you don't miss anything."
        #
        content_1_t:  'Get rid of what you don’t need'
        content_1_c:  'Use this opportunity to take a thorough look at your belongings, furniture, and appliances. Take an objective look at what you own and decide what you really need. The rule of thumb: if you haven’t used something in over a year, you probably don’t need it. If an item is in good condition but won’t fit into your new life, you can recycle it, donate it, or sell it at a garage sale or on a local listings site for a modest price. Some stores will also take back furniture and appliances and refund you. As a last resort, throw things away. Otherwise, you’ll pay to move things you don’t need.'
        #
        content_2_t:  'Measure your furniture and appliances'
        content_2_c:  'Use a tape measure on all the large appliances and furniture you plan to take with you. This will help you estimate the scale of the move and make sure a bulky piano or a large double bed will fit through the doorways in your new apartment.'
        #
        content_3_t:  'Plan the layout'
        content_3_c:  'Make a rough plan for where furniture and appliances will go in your new apartment. This will save you from moving large items between rooms repeatedly and stumbling over boxes.'
        #
        content_4_t:  'Find the right mover on our website'
        content_4_c:  'Once you know how much you need to move, look for a company that provides moving services. The cost depends on how long the job takes and how many movers are needed. It’s always best to choose a trusted company. Read reviews, and remember to leave one of your own—it can help others find a reliable, professional mover, just as reviews helped you. Tell the mover all the details in advance: the date, time, distance between locations, floor, whether there’s a freight elevator, and the size of your belongings. This will help you get an accurate quote and avoid unpleasant surprises. Sign a contract and read the terms carefully, including the company’s responsibility for your belongings, delays, and damage to the property.'
        #
        content_5_t:  'Take care of bills at your old address'
        content_5_c:  'Move into your new apartment debt-free. Before the move, check that your utility bills are paid, and write down or photograph your meter readings. Also contact your internet and TV provider to decide whether to cancel your service, transfer it to your new address, or pass it on to the new tenants. Say goodbye to your neighbors and, if possible, leave your contact details in case someone needs to reach you at your old address.'
        #
        content_6_t:  'Pack your belongings'
        content_6_c:  'Make sure you have plenty of packing materials. It’s better to have some left over than to run short at the last minute and risk damaging your belongings. Protect fragile items with regular or bubble wrap, and transport clothes in garment bags. Order cardboard boxes and sheets online or ask furniture and grocery stores for them. You’ll also need rope, packing tape, markers for labeling, trash bags, a knife, and scissors. Don’t leave packing until the last few days. Tackle it little by little: start with things you won’t need right away, such as small appliances, books, and holiday decorations. If you’re moving in summer, pack winter clothes and shoes first; in the cold season, do the opposite. That way, most things will be packed a couple of days before moving day. Label boxes on all sides and use stickers such as “Linens. Bedroom” or “Clothes. Kids’ room.” This will help the movers and make unpacking easier. Put furniture parts and their hardware in separate boxes, along with the assembly instructions.'
        #
        content_7_t:  'Get your new apartment ready'
        content_7_c:  'Clean the apartment before you move in. You’ll need to clean again after the move, but starting from scratch among boxes and bags will be much harder. Protect the door jambs from damage with cardboard and cover the floors with protective film. Check the utilities in advance: make sure the outlets work, the lights turn on, and the water runs. Check that the freight elevator is working, meet the concierge, and explore the neighborhood in case you need a hardware store or pharmacy. This will make your first few hours in your new home easier.'
        #
        content_8_t:  'Leave your old apartment clean'
        content_8_c:  'It’s always nice to move into a clean apartment, so leave yours tidy for the next residents. You may need to make a few minor repairs, such as reattaching wallpaper or replacing a baseboard. You can also hire a cleaning service and leave the keys with the concierge.'
        #
        content_9_t:  'Plan for children and pets'
        content_9_c:  'If you have young children or pets, think ahead about how they’ll be affected by the move. It can be stressful for them and add to your worries. It may be easier to have the children stay with their grandparents for a couple of days and leave your pets with friends or at a boarding facility.'
        #
        content_10_t: 'Pack the essentials'
        content_10_c: 'Pack a separate bag or backpack with everything you’ll need on moving day: clothes and shoes, documents, phone chargers, a first-aid kit, toiletries, basic dishes, and household supplies. Prepare some snacks and water and pack them in an insulated bag.'
        #
        footer:       'Hooray! Take a deep breath, let the cat into the house, and get ready for a housewarming party 🥳'
  
