uk:
    meta:
        home_page:
            title:  "Перевезення | Барахолка | Ізраїль"
            desc:   "Наш сайт пропонує зручний пошук перевізників і вживаних речей по всьому Ізраїлю. Ви можете знайти надійних і досвідчених перевізників, які допоможуть доставити вантаж або перевезти речі в будь-яку точку країни. А також знайти потрібні речі за вигідною ціною чи продати непотрібні."
        moving_preparation:
            title:  "Як підготуватися до переїзду | Ізраїль"
            desc:   "Переїхати в новий дім — означає розпочати нове життя. Розповідаємо, як підготуватися до самостійного переїзду й нічого не забути."
        carriers:
            title:  "Пошук перевізників в Ізраїлі"
            desc:   "Оберіть перевізника, який вам підходить, зважаючи на регіон і реальні відгуки про компанію."
        calculator:
            title:  "Розрахувати вартість перевезення | Ізраїль"
            desc:   "Калькулятор вартості перевезення дає змогу дізнатися приблизну вартість переїзду в компаніях, зареєстрованих у нашому сервісі."
        market:
            title:  "Купити або продати вживані речі | Ізраїль"
            desc:   "Будь-який зареєстрований користувач може розмістити оголошення про продаж вживаних речей, указавши регіон і категорію товару."
        about:
            title:  "Детальніше про послугу"
            desc:   "Розповідаємо про ідею створення сервісу та його особливості. Залиште відгук або пропозицію, як покращити сервіс."
        feedbacks:
            title:  "Відгуки про сервіс"
            desc:   "Тут ви можете залишити відгук або запропонувати, як покращити сервіс. Разом ми зробимо його кращим!"
        company:
            sign_up:
                title:  "Стати перевізником | Реєстрація компанії"
                desc:   "Зареєструйте компанію, щоб отримати безкоштовну рекламу та залучити більше клієнтів."
            sign_in:
                title:  "Увійти як перевізник"
                desc:   "Вхід до особистого кабінету перевізника."
        client:
            sign_up:
                title:  "Реєстрація користувача"
                desc:   "Створіть обліковий запис, щоб оцінювати перевізників і розміщувати оголошення про продаж своїх речей."
            sign_in:
                title:  "Вхід"
                desc:   "Вхід до особистого кабінету."
                