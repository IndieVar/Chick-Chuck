# Home page
uk:
    about:
        header:
            title:            "Ідея створення сервісу"
            desc:             "Привіт, мене звуть Олександр, я засновник Relomio. Після переїзду до Ізраїлю власний досвід і досвід людей навколо показав мені, наскільки складними можуть бути часті переїзди. Я побачив, як багато в Ізраїлі працює перевізників і як людям потрібен надійний спосіб обрати серед них. Так виникла ідея об’єднати перевізників в одному місці, спростити пошук потрібної послуги та допомогти зробити вибір завдяки справжнім оцінкам і відгукам. У Relomio також можна знайти корисні речі з рук для нового дому. Нижче я розповім про сервіс докладніше."
            founder_name:     "Олександр Варламов"
            founder_title:    "Засновник Relomio"
        calculator:
            title:            "Попередній розрахунок вартості переїзду"
            desc_html:        "Ніхто не занижує важку фізичну роботу навантажувачів і вартість палива при перевезенні ваших речей, тому послуга дозволяє перевізнику вказувати вартість дистанції капітального ремонту і перевезення окремих предметів різних категорій для кожного капітально відремонтованого поверху вниз і вгору. < br > Переїзд - справа не проста і дуже дорога, калькулятор цін дозволяє клієнту дізнатися попередню вартість переїзду серед компаній, зареєстрованих в нашому сервісі. Прорахувати всі нюанси на переїзді без особистої участі неможливо, тому попередня вартість приблизна, точна вартість переїзду узгоджується безпосередньо з перевізником."
        carriers:
            title:            "Реальні рейтинги та відгуки"
            desc_html:        "Можливість вибрати перевізника в регіоні на основі реальних відгуків про компанію, а також оцінити послуги перевізника на основі вашого досвіду."
        market:
            title:            "Можливість купувати/продавати підтримувані товари"
            desc_html:        "Будь-який зареєстрований користувач може подати оголошення про продаж підтримуваних товарів, вказавши регіон розташування, статус і категорію товару. < br > Також можна купити підтримувані предмети безпосередньо у перевізника, що дуже зручно, адже перевізники знають сенс підтримуваних речей і з ними можна прямо домовитися про доставку." 
        moving_preparation:
            title:            "Підготовка до переїзду"
            desc_html:        "Якщо ви раніше не стикалися з переїздом в іншу квартиру або мали недостатній досвід роботи в цій не простій справі, ви можете ознайомитися з нашою статтею про підготовку до переїзду, щоб планувати свій переїзд більш ретельно і відчувати себе впевнено." 
        statistics:
            title:            "Relomio у цифрах"
    