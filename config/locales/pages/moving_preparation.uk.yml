# Moving preparation
uk:  
    moving_preparation:
        title:        'Підготовка до переїзду'
        list:         'Зміст: '
        header:       'Переїхати в новий дім — означає розпочати нове життя. Кажуть, що легше пережити дві пожежі, ніж один переїзд. Але якщо все ретельно спланувати й завчасно підготуватися, переїзд мине швидко, злагоджено й навіть принесе задоволення. Розповідаємо, як підготуватися до самостійного переїзду й нічого не забути.'
        #
        content_1_t:  'Позбутися непотрібних речей'
        content_1_c:  'Це чудова нагода влаштувати масштабну ревізію речей, меблів і техніки. Критично оцініть усе нажите й подумайте, що справді потрібно, а що — ні. Золоте правило: якщо ви не користувалися річчю понад рік, навряд чи вона вам узагалі знадобиться. Якщо речі в доброму стані, але в новому житті їм немає місця, їх можна обміняти, віддати на перероблення чи передати на благодійність або продати — влаштувати «гаражний розпродаж» чи розмістити оголошення на спеціальному сайті. Багато магазинів також викуповують меблі й техніку, придбані в них. У крайньому разі речі можна викинути. Інакше доведеться переплачувати за перевезення непотребу.'
        #
        content_2_t:  'Виміряти меблі й техніку'
        content_2_c:  'Виміряйте рулеткою всю великогабаритну техніку й меблі, які плануєте забрати із собою. Так ви оціните обсяг перевезення та переконаєтеся, що громіздкий рояль чи величезне двоспальне ліжко пройдуть у дверні отвори нового житла.'
        #
        content_3_t:  'Скласти план розташування меблів'
        content_3_c:  'Складіть приблизний план розташування техніки й меблів у новій квартирі. Так вам не доведеться кілька разів перетягувати великі речі з однієї кімнати в іншу й перечіпатися через численні коробки.'
        #
        content_4_t:  'Знайти відповідного перевізника на нашому сайті'
        content_4_c:  'Оцінивши обсяг речей, які потрібно перевезти, можна шукати компанію, що займається вантажними перевезеннями. Вартість залежатиме від часу, потрібного для роботи, і кількості вантажників. Завжди краще обирати перевірену компанію. Почитайте відгуки й не забудьте залишити власний відгук про послуги перевізника: це допоможе іншим знайти добросовісну й професійну компанію, так само як відгуки колись допомогли вам. Заздалегідь повідомте перевізнику всі деталі: дату й час переїзду, відстань між районами, поверх, наявність вантажного ліфта та габарити речей. Так ви одразу дізнаєтеся точну вартість послуг і зможете уникнути неприємних сюрпризів. Укладіть договір і уважно ознайомтеся з умовами роботи компанії: яку відповідальність вона бере на себе за збереження речей, дотримання строків і псування майна.'
        #
        content_5_t:  'Залагодити рахунки за старою адресою'
        content_5_c:  'Переїжджайте до нового житла, як і в новий рік, без боргів. Перед переїздом перевірте, чи сплачено рахунки за комунальні послуги, запишіть або сфотографуйте показники лічильників. Також заздалегідь вирішіть, що робити з інтернетом і телебаченням: розірвати договір, перенести послуги провайдера на нову адресу чи передати їх майбутнім мешканцям. Попрощайтеся із сусідами й, за можливості, залиште їм свої контакти на випадок, якщо хтось шукатиме вас за старою адресою.'
        #
        content_6_t:  'Зібрати та упакувати речі'
        content_6_c:  'Не забудьте про пакувальні матеріали — їх має бути із запасом. Краще нехай щось залишиться, ніж в останню мить доведеться шукати заміну або ризикувати збереженням речей. Крихкі речі захистить звичайна й повітряно-бульбашкова плівка, а одяг можна перевозити в спеціальних чохлах. Картонні коробки й пакувальний папір замовте в інтернеті або попросіть у меблевих чи продуктових магазинах. Також знадобляться мотузка, скотч, маркери, сміттєві мішки, ніж і ножиці. Не відкладайте пакування на останні дні. Починайте з речей, які не знадобляться «тут і зараз»: дрібної техніки, книжок, новорічних прикрас. Якщо переїжджаєте влітку, спершу спакуйте зимовий одяг і взуття, а в холодну пору року — навпаки. Так за кілька днів до переїзду буде спакована більша частина речей. Підписуйте коробки й наклеюйте на них позначки, наприклад: «Текстиль. Спальня», «Одяг. Дитяча». Це допоможе і вантажникам, і вам під час розпакування. Деталі розібраних меблів складайте в окремі коробки разом із кріпленнями, туди ж покладіть інструкції зі збирання.'
        #
        content_7_t:  'Підготувати нове житло'
        content_7_c:  'Перед заселенням у нове житло наведіть у ньому лад. Прибирати доведеться і після переїзду, але серед коробок і мішків це буде складніше. Захистіть дверні укоси картоном, а підлогу накрийте захисною плівкою. Також заздалегідь перевірте всі комунікації: чи працюють розетки, чи вмикається світло, чи є вода. Переконайтеся, що вантажні ліфти працюють, познайомтеся з консьєржем і прогуляйтеся районом — раптом терміново знадобиться господарський магазин або аптека. Це значно полегшить перші кілька годин на новому місці.'
        #
        content_8_t:  'Навести порядок у старому житлі'
        content_8_c:  'Вам, напевно, приємно заїжджати в чисту квартиру, тож і після себе залиште лад. Можливо, доведеться зробити дрібний косметичний ремонт — підклеїти шпалери або замінити плінтус. Можна викликати клінінгову компанію й залишити ключі консьєржу.'
        #
        content_9_t:  'Подбати про дітей і домашніх тварин'
        content_9_c:  'Якщо у вас є маленькі діти чи домашні тварини, заздалегідь подумайте, як вони перенесуть переїзд. Для них це буде сильним стресом, а для вас — додатковими клопотами й переживаннями. Можливо, дітей краще на кілька днів відправити в гості до бабусь і дідусів, а тварин тимчасово залишити в друзів або на платній перетримці.'
        #
        content_10_t: 'Зібрати необхідний мінімум'
        content_10_c: 'Окремо зберіть сумку чи рюкзак із речами, які знадобляться в день переїзду: одягом і взуттям, документами, зарядними пристроями, аптечкою, засобами гігієни, посудом першої потреби та побутовою хімією. Візьміть їжу для перекусу й воду; за потреби покладіть їх у термосумку.'
        #
        footer:       'Ура! Видихніть, впускайте кота до нового дому й готуйтеся до новосілля! 🥳'
