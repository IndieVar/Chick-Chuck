he:
    meta:
        home_page:
            title:  "הובלות | לוח יד שנייה | ישראל"
            desc:   "באתר שלנו תוכלו למצוא מובילים מנוסים ואמינים להובלת מטענים ומעברי דירה בכל רחבי ישראל. תוכלו גם למצוא פריטי יד שנייה במחירים משתלמים או להרוויח ממכירת חפצים שאינכם צריכים."
        moving_preparation:
            title:  "איך להתכונן למעבר דירה | ישראל"
            desc:   "מעבר לבית חדש הוא הזדמנות להתחלה חדשה. נסביר איך להתכונן למעבר באופן עצמאי ולא לשכוח דבר."
        carriers:
            title:  "מציאת מוביל בישראל"
            desc:   "מצאו מוביל מתאים לפי אזור וחוות דעת אמיתיות על החברה."
        calculator:
            title:  "חישוב עלות ההובלה | ישראל"
            desc:   "מחשבון ההובלות מאפשר לקבל הערכה ראשונית של עלות המעבר מחברות הרשומות בשירות שלנו."
        market:
            title:  "קנה/מכור פריטים משומשים | ישראל"
            desc:   "כל משתמש רשום יכול לפרסם מודעה למכירת פריטי יד שנייה ולציין את האזור ואת קטגוריית הפריט."
        about:
            title:  "עוד על השירות"
            desc:   "קראו על הרעיון שמאחורי השירות ועל התכונות שלו. השאירו חוות דעת או הצעה לשיפור השירות."
        feedbacks:
            title:  "חוות דעת על השירות"
            desc:   "כאן תוכלו להשאיר חוות דעת או להציע דרכים לשיפור השירות. יחד נהפוך אותו לטוב יותר!"
        company:
            sign_up:
                title:  "הצטרפו כמובילים | רישום חברה"
                desc:   "רשמו את החברה שלכם כדי לקבל פרסום בחינם ולמשוך לקוחות נוספים לעסק!"
            sign_in:
                title:  "התחברות כמוביל"
                desc:   "כניסה לאזור האישי של המוביל."
        client:
            sign_up:
                title:  "רישום משתמש"
                desc:   "צרו חשבון כדי לדרג מובילים ולפרסם מודעות למכירת החפצים שלכם."
            sign_in:
                title:  "כניסה"
                desc:   "כניסה לאזור האישי שלכם."
                