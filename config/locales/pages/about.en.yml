en:
    about:
        header:
            title:            "The Idea Behind the Service"
            desc:             "Hello, my name is Alexander. I am the founder and creator of Chick-Chuck.com. After moving to Israel, I experienced firsthand—and through the people around me—the need to move frequently within the country. I noticed how many carriers there are in Israel and how much demand there is for their services. I realized it would be useful to bring carriers together on one site, making it easier for customers to find one based on their needs and, most importantly, genuine ratings and reviews. This would help people avoid unscrupulous carriers and make their move more pleasant. Those without a home of their own who have to move from one rented apartment to another understand what I mean. Below, I’ll tell you a little about my service."
            founder_name:     "Aleksandr Varlamov"
            founder_title:    "Founder of Chick-Chuck.com"
        calculator:
            title:            "Preliminary Moving Cost Estimate"
            desc_html:        "The physical work loaders do and the fuel required to transport your belongings should not be underestimated. That is why our service lets carriers set their rates for distance traveled and for carrying items up or down stairs, with rates varying by item category and floor. <br>Moving is difficult and expensive. Our calculator lets customers estimate moving costs from companies registered with our service. Not all details can be accounted for without an in-person assessment, so the estimate is approximate; agree on the final price directly with the carrier."
        carriers:
            title:            "Real ratings and reviews"
            desc_html:        "Choose a carrier in your region based on genuine reviews of the company, and rate the carrier's services based on your own experience."
        market:
            title:            "Buy and Sell Used Items"
            desc_html:        "Any registered user can post an ad to sell used items, specifying the item's region and category. <br>You can also buy used items directly from a carrier. This is convenient because carriers know their way around used goods, and you can arrange delivery directly with them."
        moving_preparation:
            title:            "Preparation for relocation"
            desc_html:        "If you have never moved to another apartment or have little experience with this challenging task, read our article on preparing for a move. It will help you plan carefully and feel more confident."
    
    