# Home page
ru:
    about:
        header:
            title:            "Идея создания сервиса"
            desc:             "Здравствуйте, меня зовут Александр. Я основатель сервиса Chick-Chuck.com. После переезда в Израиль я на собственном опыте и опыте окружающих столкнулся с необходимостью часто переезжать внутри страны. Я заметил, насколько много в Израиле перевозчиков и насколько востребованы их услуги. Тогда я понял, что было бы удобно объединить всех перевозчиков на одном сайте, чтобы упростить их поиск по нужным клиенту критериям, а главное — по реальным рейтингам и отзывам. Это помогло бы избежать недобросовестных перевозчиков и сделать переезд более комфортным. Те, у кого нет собственного жилья и кто вынужден постоянно переезжать из одной арендованной квартиры в другую, понимают, о чем я. Ниже я расскажу немного о своем сервисе."
            founder_name:     "Александр Варламов"
            founder_title:    "Основатель Chick-Chuck.com"
        calculator:
            title:            "Предварительный расчет стоимости переезда"
            desc_html:        "Нельзя недооценивать тяжелый физический труд грузчиков и расходы на топливо при перевозке вещей. Поэтому сервис позволяет перевозчику указать стоимость перевозки на определенное расстояние, а также стоимость подъема и спуска вещей с учетом их категории и этажа. <br> Переезд — дело непростое и затратное. Калькулятор позволяет клиенту узнать примерную стоимость переезда у компаний, зарегистрированных в нашем сервисе. Невозможно учесть все нюансы переезда без личного осмотра, поэтому точную стоимость нужно согласовать непосредственно с перевозчиком."
        carriers:
            title:            "Реальные рейтинги и отзывы"
            desc_html:        "Возможность выбрать перевозчика с учетом региона и реальных отзывов о компании, а также оценить его услуги, поделившись своим опытом."
        market:
            title:            "Возможность купить или продать подержанные вещи"
            desc_html:        "Любой зарегистрированный пользователь может подать объявление о продаже подержанных вещей, указав регион и категорию товара. <br> Также можно купить подержанные вещи напрямую у перевозчика. Это очень удобно: перевозчики знают толк в таких вещах, и с ними можно договориться о доставке."
        moving_preparation:
            title:            "Подготовка к переезду"
            desc_html:        "Если вам раньше не приходилось переезжать в другую квартиру или у вас недостаточно опыта в этом непростом деле, ознакомьтесь с нашей статьей о подготовке к переезду, чтобы тщательнее спланировать его и чувствовать себя увереннее."
            