# Home page
ru:
    about:
        header:
            title:            "Идея создания сервиса"
            desc:             "Здравствуйте, меня зовут Александр. Я основатель и создатель сервиса Relomio. После переезда в Израиль я на личном опыте и опыте окружающих меня людей столкнулся с задачей постоянных переездов внутри страны. Я заметил, насколько много в Израиле перевозчиков и насколько это востребованная сфера. Затем я понял, что было бы удобно объединить всех перевозчиков на одном сайте, чтобы облегчить поиск перевозчика по нужным клиенту критериям и, главное, по реальным рейтингам и отзывам клиентов, чтобы не напороться на недобросовестного перевозчика и остаться довольным своим переездом. Те, кто не имеет собственного жилья и вынужден постоянно переезжать с одной арендованной квартиры в другую, понимают, о чем я. Ниже я расскажу немного о моем сервисе."
            founder_name:     "Александр Варламов"
            founder_title:    "Основатель Relomio"
        calculator:
            title:            "Предварительный расчет стоимости переезда"
            desc_html:        "Нельзя недооценивать тяжелую физическую работу грузчиков и расходы на топливо при перевозке ваших вещей, поэтому сервис позволяет перевозчику указать стоимость за преодолимую дистанцию и перевозку определенных предметов разной категории за каждый преодолимый этаж вниз и вверх. <br> Переезд — дело непростое и очень затратное, калькулятор стоимости перевозки позволяет клиенту узнать предварительную стоимость переезда у компаний, зарегистрированных в нашем сервисе. Невозможно рассчитать все нюансы при переезде без личного участия, поэтому предварительная стоимость является приблизительной, а точная стоимость переезда согласовывается непосредственно с перевозчиком."
        carriers:
            title:            "Реальные рейтинги и отзывы"
            desc_html:        "Возможность выбрать перевозчика по региону и реальным отзывам о компании, а также по достоинству оценить услуги перевозчика на основе собственного опыта."
        market:
            title:            "Возможность купить/продать подержанные вещи"
            desc_html:        "Любой зарегистрированный пользователь может подать объявление о продаже подержанных вещей, указывая регион местоположения и категорию предмета. <br> Также можно купить подержанные вещи напрямую у перевозчика, что очень удобно, ведь перевозчики знают толк в подержанных вещах и с ними можно напрямую договориться о доставке."
        moving_preparation:
            title:            "Подготовка к переезду"
            desc_html:        "Если вам не приходилось ранее сталкиваться с переездом в другую квартиру или вы имеете недостаточно опыта в этом непростом деле, то вы можете ознакомиться с нашей статьей о подготовке к переезду, чтобы тщательнее спланировать свой переезд и чувствовать себя увереннее."
        statistics:
            title:            "Relomio в цифрах"
            