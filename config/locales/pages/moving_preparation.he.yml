# Moving preparation
he:  
    moving_preparation:
        title:        'הכנה למעבר דירה'
        list:         'תוכן עניינים: '
        header:       'מעבר לבית חדש פירושו התחלה חדשה. יש אומרים שקל יותר לעבור שתי שריפות מאשר לעבור דירה פעם אחת. אבל אם מתכננים הכול בקפידה ומתכוננים מראש, המעבר יכול לעבור במהירות, ביעילות ואפילו בהנאה. כך תתכוננו למעבר עצמאי בלי לשכוח דבר.'
        #
        content_1_t:  'להיפטר מדברים מיותרים'
        content_1_c:  'זו הזדמנות מצוינת למיין את החפצים, הרהיטים ומכשירי החשמל שלכם. בחנו את הדברים שבבעלותכם וחשבו מה באמת נחוץ ומה לא. כלל אצבע: אם לא השתמשתם בפריט במשך יותר משנה, כנראה שאינכם זקוקים לו. אם הפריטים במצב טוב אך אין להם מקום בבית החדש, תוכלו להחליף אותם, למסור אותם למיחזור או לצדקה, או למכור אותם במכירת חצר או באתרי מודעות. חנויות רבות מקבלות בחזרה רהיטים ומכשירי חשמל שנרכשו אצלן ומשלמות תמורתם. כמוצא אחרון, זרקו אותם — אחרת תשלמו יותר על הובלת פסולת.'
        #
        content_2_t:  'למדוד את הרהיטים ואת מכשירי החשמל'
        content_2_c:  'מדדו בעזרת סרט מדידה את כל הרהיטים ומכשירי החשמל הגדולים שאתם מתכוונים לקחת. כך תוכלו להעריך את היקף ההובלה ולוודא שהרהיטים הגדולים יעברו בפתחי הדלתות בדירה החדשה.'
        #
        content_3_t:  'לתכנן את סידור הרהיטים'
        content_3_c:  'תכננו מראש היכן יוצבו הרהיטים ומכשירי החשמל בדירה החדשה. כך לא תצטרכו לגרור חפצים גדולים מחדר לחדר שוב ושוב ולהיתקל בערימות של ארגזים.'
        #
        content_4_t:  'למצוא מוביל מתאים באתר שלנו'
        content_4_c:  'לאחר שהערכתם את היקף ההובלה, תוכלו לחפש חברה שתטפל בה. העלות תלויה במשך העבודה ובמספר העובדים שתצטרכו. מומלץ לבחור חברה אמינה. קראו חוות דעת ואל תשכחו להשאיר חוות דעת משלכם על שירותי המוביל — כך תעזרו לאחרים למצוא מוביל אמין ומקצועי, כפי שעזרו לכם. מסרו למוביל מראש את כל הפרטים: תאריך, שעה, מרחק בין האזורים, קומה, קיומה של מעלית משא ומידות החפצים. כך תוכלו לקבל הערכת מחיר מדויקת ולמנוע הפתעות לא נעימות. חתמו על חוזה וקראו בקפידה את תנאי העבודה של החברה: איזו אחריות היא מקבלת על החפצים, על עיכובים ועל נזק לרכוש.'
        #
        content_5_t:  'להסדיר חשבונות בכתובת הישנה'
        content_5_c:  'עברו לדירה החדשה בלי חובות. לפני המעבר בדקו אם החשבונות שולמו, ורשמו או צלמו את קריאות המונים. הסדירו מראש גם את שירותי האינטרנט והטלוויזיה: החליטו אם לבטל את החוזה, להעביר את השירותים לכתובת החדשה או להעביר אותם לדיירים הבאים. היפרדו מהשכנים, ואם אפשר, השאירו להם פרטי קשר למקרה שמישהו יחפש אתכם בכתובת הישנה.'
        #
        content_6_t:  'לאסוף ולארוז את החפצים'
        content_6_c:  'הצטיידו בכמות מספקת של חומרי אריזה — עדיף שיישארו חומרים מאשר שתצטרכו לחפש פתרונות ברגע האחרון או להסתכן בנזק לחפצים. הגנו על חפצים שבירים בניילון רגיל או בניילון בועות, ואפשר להעביר בגדים בכיסויים מיוחדים. הזמינו מראש ארגזי קרטון ונייר אריזה או בקשו אותם מחנויות רהיטים ומזון. תצטרכו גם חבל, סרט הדבקה, טושים לסימון, שקיות אשפה, סכין ומספריים. אל תדחו את האריזה לימים האחרונים. התחילו מחפצים שאינכם צריכים כרגע, כמו מכשירי חשמל קטנים, ספרים וקישוטי חג. אם אתם עוברים בקיץ, התחילו בבגדי החורף ובנעליים; בחורף עשו את ההפך. כך רוב החפצים יהיו ארוזים כמה ימים לפני המעבר. כתבו על הארגזים מכל הצדדים והדביקו תוויות, למשל: \"טקסטיל. חדר שינה\", \"בגדים. חדר ילדים\". כך יהיה קל יותר לסבלים ולכם לפרוק ולמיין את החפצים. הניחו חלקי רהיטים מפורקים יחד עם האביזרים והברגים בארגזים נפרדים, והוסיפו להם את הוראות ההרכבה.'
        #
        content_7_t:  'להכין את הדירה החדשה'
        content_7_c:  'נקו את הדירה לפני הכניסה. תצטרכו לנקות גם לאחר מכן, אבל קשה יותר להתחיל מאפס בין ארגזים ושקיות. הגנו על משקופי הדלתות באמצעות קרטון וכסו את הרצפה ביריעת מגן. בדקו מראש את התשתיות: שהשקעים פועלים, שהאורות נדלקים ושהמים זורמים. בדקו את מעליות המשא, הכירו את השוער וסיירו בשכונה — אולי תצטרכו בדחיפות חנות לכלי בית או בית מרקחת. כך השעות הראשונות בבית החדש יהיו קלות יותר.'
        #
        content_8_t:  'לסדר את הדירה הישנה'
        content_8_c:  'נעים להיכנס לדירה נקייה, לכן השאירו אותה מסודרת ככל האפשר. ייתכן שתצטרכו לבצע תיקונים קלים, כמו להדביק טפט או להחליף פנל. אפשר להזמין חברת ניקיון ולהשאיר את המפתחות אצל השוער.'
        #
        content_9_t:  'לדאוג לילדים ולחיות המחמד'
        content_9_c:  'אם יש לכם ילדים קטנים או חיות מחמד, חשבו מראש כיצד ישתתפו במעבר. המעבר עלול להיות מלחיץ עבורם ולהוסיף לכם דאגות. אולי כדאי לשלוח את הילדים לכמה ימים אצל סבא וסבתא, ואת חיות המחמד להשאיר זמנית אצל חברים או בפנסיון בתשלום.'
        #
        content_10_t: 'לאסוף את הדברים החיוניים'
        content_10_c: 'ארזו בנפרד תיק או תרמיל עם הדברים שתצטרכו ביום המעבר: בגדים ונעליים, מסמכים, מטענים לטלפונים, ערכת עזרה ראשונה, מוצרי רחצה, כלי מטבח בסיסיים וחומרי ניקוי. הכינו אוכל לנשנוש ומים, ושימו אותם בצידנית.'
        #
        footer:       'יופי! נשמו לרווחה, תנו לחתול להיכנס לבית והתכוננו לחנוכת הבית 🥳'
