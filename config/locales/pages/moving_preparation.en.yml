# Moving Preparation
en:
    moving_preparation:
        title:        'Preparing for a move'
        list:         'Contents: '
        header:       "Moving into a new home means starting a new life. People say moving is worse than going through two fires, but with careful planning and preparation, it can go quickly and smoothly—and even be enjoyable. Here's how to prepare for a move without missing a thing."
        #
        content_1_t:  'Get rid of what you no longer need'
        content_1_c:  'This is a great opportunity to take stock of your belongings, furniture, and appliances. Take a critical look at what you own and decide what you really need. The golden rule: if you haven’t used something in over a year, you probably don’t need it. If an item is in good condition but has no place in your new home, you could trade it, donate it to a charity, recycle it, or sell it at a “garage sale” or on a specialist website. Some stores may also take back furniture and appliances and refund you. As a last resort, throw things away. Otherwise, you’ll pay to move things you don’t need.'
        #
        content_2_t:  'Measure your furniture and appliances'
        content_2_c:  'Use a tape measure to measure all the large appliances and pieces of furniture you plan to take with you. This will help you estimate the size of the move and make sure that a bulky piano or an enormous double bed will fit through the doorways in your new apartment.'
        #
        content_3_t:  'Plan the layout'
        content_3_c:  'Sketch out where you plan to put the furniture and appliances in your new apartment. This will save you from moving large items from room to room several times and stumbling over countless boxes.'
        #
        content_4_t:  'Find the right carrier on our website'
        content_4_c:  'Once you know how much you need to move, you can look for a company that handles moving services. The cost depends on how long the job takes and how many movers are needed. It’s always best to choose a reputable company. Read the reviews, and remember to leave one yourself: it will help others find a reliable, professional carrier, just as reviews helped you. Tell the carrier all the details in advance: the date and time, the distance between locations, the floor, whether there is a service elevator, and the size of your items. This will help you get an accurate quote and avoid unpleasant surprises. Sign a contract and carefully review the company’s terms, including its responsibility for your belongings, meeting deadlines, and any damage to the property.'
        #
        content_5_t:  'Settle your bills at the old address'
        content_5_c:  'Move into your new apartment debt-free, just like starting the new year. Before you move, check that your utility bills are paid and write down or photograph the meter readings. Also, contact your internet and TV providers and decide whether to cancel your service, transfer it to your new address, or pass it on to the new tenants. Say goodbye to your neighbors and, if possible, leave your contact details in case someone needs to reach you at your old address.'
        #
        content_6_t:  'Pack your belongings'
        content_6_c:  'Make sure you have plenty of packing materials. It’s better to have some left over than to look for alternatives at the last minute and risk damaging your belongings. Protect fragile items with regular or bubble wrap, and pack clothes in wardrobe boxes. Order cardboard boxes and sheets online, or ask furniture and grocery stores for them. You’ll also need rope, packing tape, markers for labeling, garbage bags, a knife, and scissors. Don’t leave packing until the last few days. Take it one step at a time: start with things you won’t need right away, such as small appliances, books, and holiday decorations. If you’re moving in summer, start with winter clothes and shoes; in the cold season, do the opposite. That way, most of your belongings will be packed a couple of days before the move. Label the boxes on all sides and add stickers, such as “Linens. Bedroom” or “Clothes. Children’s room.” This will help the movers and make unpacking easier. Put disassembled furniture parts and their hardware in separate boxes, along with the assembly instructions.'
        #
        content_7_t:  'Prepare a new apartment'
        content_7_c:  'Clean your new apartment before moving in. You’ll need to clean it again afterward, but starting from scratch among boxes and bags will be much harder. Protect the door frames from damage with cardboard and cover the floors with protective film. Also, check that all utilities are working in advance: the outlets work, the lights turn on, and the water runs. Make sure the service elevators are working, meet the concierge, and explore the neighborhood in case you urgently need a hardware store or pharmacy. This will make your first few hours in your new home easier.'
        #
        content_8_t:  'Clean up the old apartment'
        content_8_c:  'You’ll appreciate moving into a clean apartment, so leave your old one clean, too. You may need to do a few minor repairs, such as reattaching wallpaper or replacing a baseboard. You could also hire a cleaning company and leave the keys with the concierge.'
        #
        content_9_t:  'Take care of children and pets'
        content_9_c:  'If you have small children or pets, think ahead about how they’ll handle the move. It will be stressful for them and add unnecessary worry for you. It may be better to send the children to stay with their grandparents for a couple of days and leave your pets with friends or at a paid boarding facility for a while.'
        #
        content_10_t: 'Pack an essentials bag'
        content_10_c: 'Pack a separate bag or backpack with everything you’ll need on moving day: clothes and shoes, documents, phone chargers, a first-aid kit, toiletries, essential dishes, and household cleaning supplies. Pack some snacks and water in an insulated bag.'
        #
        footer:       'Hooray! Take a breath, let the cat into your new home, and get ready to celebrate 🥳'
  
