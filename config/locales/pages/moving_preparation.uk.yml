# Moving preparation
uk:  
    moving_preparation:
        title:        'Підготовка до переїзду'
        list:         'Зміст: '
        header:       'Переїхати в новий дім — означає розпочати нове життя. Кажуть, що легше пережити дві пожежі, ніж один переїзд. Але якщо все ретельно спланувати й завчасно підготуватися, переїзд мине швидко, злагоджено й навіть принесе задоволення. Розповідаємо, як підготуватися до самостійного переїзду й нічого не забути.'
        #
        content_1_t:  'Позбутися непотрібних речей'
        content_1_c:  'Це чудова нагода влаштувати масштабну ревізію речей, меблів і техніки. Критично оцініть нажите й подумайте, що справді потрібно, а що ні. Золоте правило: якщо ви не користувалися річчю понад рік, навряд чи вона вам узагалі знадобиться. Якщо речі в хорошому стані, але в новому домі їм немає місця, їх можна обміняти, віддати на переробку чи благодійність або навіть продати — влаштувати «гаражний розпродаж» чи розмістити оголошення на спеціальних сайтах за невелику ціну. Багато магазинів також приймають назад придбані в них меблі й техніку та платять за це. У крайньому разі викиньте непотрібне, інакше доведеться переплачувати за вивезення сміття.'
        #
        content_2_t:  'Виміряти розміри меблів і техніки'
        content_2_c:  'Виміряйте рулеткою всю великогабаритну техніку й меблі, які заберете із собою. Так ви оціните обсяг перевезення й переконаєтеся, що громіздкий рояль чи велике двоспальне ліжко пройдуть у дверні отвори нового житла.'
        #
        content_3_t:  'Скласти план розташування речей'
        content_3_c:  'Складіть приблизний план розташування техніки й меблів у новій квартирі. Так вам не доведеться кілька разів переносити великі речі з однієї кімнати в іншу й спотикатися об коробки.'
        #
        content_4_t:  'Знайти відповідного перевізника на нашому сайті'
        content_4_c:  'Оцінивши обсяг речей, які потрібно перевезти, можна шукати компанію, що займається вантажними перевезеннями. Вартість залежатиме від часу, потрібного для роботи, і кількості працівників. Краще обрати перевірену компанію. Почитайте відгуки й не забудьте залишити власний відгук про послуги перевізника: це допоможе іншим знайти добросовісного та професійного фахівця, як колись допомогло вам. Заздалегідь повідомте перевізнику всі деталі: дату, час, відстань між районами, поверх, наявність вантажного ліфта та розміри речей. Так ви одразу дізнаєтеся вартість послуги й уникнете неприємних сюрпризів. Укладіть договір і уважно ознайомтеся з умовами роботи компанії, зокрема з її відповідальністю за речі, порушення строків і пошкодження майна будинку.'
        #
        content_5_t:  'Розібратися з квитанціями й рахунками за старою адресою'
        content_5_c:  'Переїжджайте в нове житло, як у новий рік, — без боргів. Перед переїздом перевірте, чи сплачені рахунки за комунальні послуги, запишіть або сфотографуйте показники лічильників. Також заздалегідь вирішіть, що робити з інтернетом і телебаченням: розірвати договір, перенести послуги на нову адресу чи передати їх майбутнім мешканцям. Попрощайтеся із сусідами й, за можливості, залиште їм свої контакти на випадок, якщо хтось шукатиме вас за старою адресою.'
        #
        content_6_t:  'Зібрати та упакувати речі'
        content_6_c:  'Не забудьте про пакувальні матеріали — їх має бути із запасом. Краще нехай щось залишиться, ніж доведеться в останню мить шукати заміну або ризикувати збереженням речей. Крихкі речі захистить звичайна та пухирчаста плівка, одяг можна перевозити у спеціальних чохлах. Картонні коробки й папір замовте в інтернеті або попросіть у меблевих чи продуктових магазинах. Також знадобляться мотузка, скотч, маркери, сміттєві пакети, ніж і ножиці. Не відкладайте пакування на останні дні. Починайте з речей, які не знадобляться «тут і зараз»: дрібної техніки, книжок, новорічних прикрас. Якщо переїжджаєте влітку, почніть із зимового одягу та взуття, а в холодну пору року — навпаки. Так за кілька днів до переїзду буде спакована більша частина речей. Підписуйте коробки з усіх боків і позначайте їх наліпками, наприклад: «Текстиль. Спальня», «Одяг. Дитяча». Це допоможе і перевізникам, і вам під час розпакування. Деталі розібраних меблів разом із кріпленнями складайте в окремі коробки, туди ж покладіть інструкції зі збирання.'
        #
        content_7_t:  'Підготувати нове житло'
        content_7_c:  'Перед заселенням наведіть лад у новому житлі. Прибирати доведеться і після переїзду, але робити все з нуля серед коробок і пакетів буде складніше. Захистіть дверні укоси картоном від пошкоджень, а підлогу накрийте захисною плівкою. Заздалегідь перевірте всі комунікації: чи працюють розетки, чи вмикається світло, чи є вода. Перевірте роботу вантажних ліфтів, познайомтеся з консьєржем і прогуляйтеся районом — раптом терміново знадобиться господарський магазин або аптека. Це значно полегшить перші години життя на новому місці.'
        #
        content_8_t:  'Навести порядок у старому житлі'
        content_8_c:  'Напевно, вам приємно заїжджати в чисте житло, тож і після себе залиште якомога більше ладу. Можливо, доведеться зробити дрібний косметичний ремонт — підклеїти шпалери або замінити плінтус. Можна викликати клінінгову компанію й залишити ключі консьєржу.'
        #
        content_9_t:  'Подбати про дітей і домашніх тварин'
        content_9_c:  'Якщо у вас є маленькі діти чи домашні тварини, заздалегідь подумайте, як вони переживуть переїзд. Для них це буде великим стресом, а для вас — додатковими клопотами й хвилюваннями. Можливо, дітей краще на кілька днів відправити в гості до дідуся й бабусі, а тварин тимчасово залишити друзям або в платній перетримці.'
        #
        content_10_t: 'Зібрати необхідний мінімум'
        content_10_c: 'Окремо зберіть сумку чи рюкзак із речами, які знадобляться в день переїзду: одягом і взуттям, документами, зарядними пристроями для телефонів, аптечкою, засобами особистої гігієни, найнеобхіднішим посудом і побутовою хімією. Приготуйте їжу для перекусів і воду та покладіть їх у термосумку.'
        #
        footer:       'Ура! Видихайте, запускайте в дім кота й готуйтеся до новосілля! 🥳'
