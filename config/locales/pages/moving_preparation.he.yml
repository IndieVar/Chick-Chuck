# Moving preparation
he:  
    moving_preparation:
        title:        'הכנה למעבר דירה'
        list:         'תוכן העניינים: '
        header:       'מעבר לבית חדש הוא התחלה של חיים חדשים. יש האומרים שקל יותר לשרוד שתי שריפות מאשר מעבר דירה אחד. אבל אם מתכננים הכול בקפידה ומתכוננים מראש, המעבר יעבור במהירות וביעילות ואולי אפילו יהיה מהנה. כך תתכוננו למעבר עצמאי בלי לפספס דבר.'
        #
        content_1_t:  'להיפטר מדברים מיותרים'
        content_1_c:  'זו הזדמנות מצוינת למיין את החפצים, הרהיטים והמכשירים שלכם. בחנו אותם היטב וחשבו מה באמת נחוץ ומה לא. כלל אצבע: אם לא השתמשתם בפריט יותר משנה, כנראה שאינכם זקוקים לו. אם הפריטים במצב טוב אך אין להם מקום בבית החדש, תוכלו להחליף אותם, למסור אותם למִחזור או לצדקה, או למכור אותם — למשל במכירת חצר או במודעה באתר ייעודי. חנויות רבות מקבלות בחזרה רהיטים ומכשירי חשמל שנרכשו אצלן ומשלמות תמורתם. כמוצא אחרון, אפשר לזרוק את הפריטים; אחרת תשלמו יותר על הובלת חפצים שאין בהם צורך.'
        #
        content_2_t:  'למדוד את הרהיטים והמכשירים'
        content_2_c:  'מדדו בעזרת סרט מדידה את כל הרהיטים והמכשירים הגדולים שאתם מתכוונים לקחת אתכם. כך תוכלו להעריך את נפח ההובלה ולוודא שפריטים גדולים, כמו פסנתר כנף או מיטה זוגית גדולה, יוכלו לעבור בפתחי הדלתות בדירה החדשה.'
        #
        content_3_t:  'לתכנן את סידור הרהיטים'
        content_3_c:  'תכננו מראש כיצד יסודרו הרהיטים והמכשירים בדירה החדשה. כך לא תצטרכו לגרור שוב ושוב פריטים גדולים מחדר לחדר ולהיתקל באינספור ארגזים.'
        #
        content_4_t:  'למצוא מוביל מתאים באתר שלנו'
        content_4_c:  'אחרי שהערכתם את היקף החפצים שיש להעביר, תוכלו לחפש חברה שתטפל בהובלה. המחיר תלוי במשך העבודה ובמספר הסבלים הדרושים. עדיף תמיד לבחור בחברה אמינה. קראו חוות דעת ואל תשכחו להשאיר חוות דעת משלכם על שירותי המוביל — כך תעזרו לאחרים למצוא חברה אמינה ומקצועית, כפי שחוות דעת של אחרים עזרו לכם. מסרו למוביל מראש את כל הפרטים: תאריך, שעה, מרחק בין האזורים, קומה, זמינות של מעלית משא ומידות החפצים. כך תוכלו לברר את המחיר המדויק ולמנוע הפתעות לא נעימות. חתמו על חוזה וקראו היטב את תנאי החברה: איזו אחריות היא נוטלת על שמירת החפצים, עמידה בלוחות הזמנים ונזק לרכוש.'
        #
        content_5_t:  'לטפל בחשבונות ובקבלות בכתובת הישנה'
        content_5_c:  'היכנסו לדירה החדשה, ממש כמו לשנה חדשה, בלי חובות. לפני המעבר בדקו אם חשבונות השירותים שולמו, ורשמו או צלמו את קריאות המונים. החליטו מראש מה לעשות עם האינטרנט והטלוויזיה: האם לבטל את החוזה, להעביר את שירותי הספק לכתובת החדשה או להעביר אותם לדיירים הבאים. היפרדו מהשכנים, ואם אפשר, השאירו להם פרטי קשר למקרה שמישהו יחפש אתכם בכתובת הישנה.'
        #
        content_6_t:  'לאסוף ולארוז את החפצים'
        content_6_c:  'חשוב להצטייד בכמות מספקת של חומרי אריזה. עדיף שיישארו חומרים מאשר שתצטרכו לחפש תחליף ברגע האחרון או להסתכן בפגיעה בחפצים. עטפו חפצים שבירים בניילון רגיל או בניילון בועות, ואפשר להעביר בגדים בכיסויי בגדים מיוחדים. הזמינו מראש ארגזי קרטון ונייר, או בקשו אותם בחנויות רהיטים ומזון. תצטרכו גם חבל, סרט הדבקה, טושים, שקיות אשפה, סכין ומספריים. אל תדחו את האריזה לימים האחרונים. התחילו בחפצים שלא תזדקקו להם מיד, כמו מכשירים קטנים, ספרים וקישוטי חג. אם אתם עוברים בקיץ, ארזו תחילה בגדי חורף ונעליים, ובחורף עשו את ההפך. כך רוב החפצים כבר יהיו ארוזים כמה ימים לפני המעבר. כתבו על הארגזים והדביקו עליהם מדבקות, למשל: «טקסטיל — חדר שינה», «בגדים — חדר ילדים». כך יהיה קל יותר גם לסבלים וגם לכם לפרוק ולסדר. אחסנו חלקי רהיטים מפורקים בארגזים נפרדים יחד עם הברגים והאביזרים, והכניסו אליהם גם את הוראות ההרכבה.'
        #
        content_7_t:  'להכין את הדירה החדשה'
        content_7_c:  'לפני המעבר לדירה החדשה, נקו אותה. תצטרכו לנקות גם אחר כך, אבל קשה יותר להתחיל מאפס בין ארגזים ושקיות. הגנו על משקופי הדלתות באמצעות קרטון וכסו את הרצפה ביריעת מגן. בדקו מראש שכל התשתיות תקינות: שהשקעים עובדים, שהאורות נדלקים ושיש מים. בדקו את מעליות המשא, הכירו את השוער וצאו לסיור בשכונה — אולי תזדקקו בדחיפות לחנות כלי בית או לבית מרקחת. כך יקלו עליכם השעות הראשונות במקום החדש.'
        #
        content_8_t:  'לסדר את הדירה הישנה'
        content_8_c:  'נעים להיכנס לדירה נקייה, לכן השאירו אחריכם דירה מסודרת. ייתכן שתצטרכו לבצע תיקונים קוסמטיים קטנים, כמו להדביק טפט או להחליף פנל. אפשר להזמין חברת ניקיון ולהשאיר את המפתחות אצל השוער.'
        #
        content_9_t:  'לדאוג לילדים ולחיות המחמד'
        content_9_c:  'אם יש לכם ילדים קטנים או חיות מחמד, חשבו מראש כיצד יעברו את המעבר. הוא עלול להיות מלחיץ עבורם ולהוסיף לכם דאגות. אולי כדאי לשלוח את הילדים לכמה ימים אצל סבא וסבתא, ואת חיות המחמד להשאיר זמנית אצל חברים או בפנסיון בתשלום.'
        #
        content_10_t: 'לארוז את הדברים החיוניים'
        content_10_c: 'ארזו בנפרד תיק או תרמיל עם הדברים שתצטרכו ביום המעבר: בגדים ונעליים, מסמכים, מטענים, ערכת עזרה ראשונה, מוצרי רחצה, כלי מטבח בסיסיים וחומרי ניקוי. קחו גם אוכל לנשנוש ומים, ובמידת הצורך ארזו אותם בצידנית.'
        #
        footer:       'יופי! נשמו לרווחה, הכניסו את החתול הביתה והתכוננו לחנוכת הבית 🥳'
