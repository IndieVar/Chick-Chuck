# Home page
uk:
    about:
        header:
            title:            "Ідея створення сервісу"
            desc:             "Вітаю, мене звати Олександр, я засновник Relomio. Після переїзду до Ізраїлю власний досвід і досвід людей навколо показали мені, наскільки складними можуть бути часті переїзди. Я побачив, як багато в Ізраїлі перевізників і як людям потрібен надійний спосіб обрати серед них. Так виникла ідея об’єднати перевізників в одному місці, спростити пошук потрібної послуги та допомогти зробити вибір завдяки справжнім оцінкам і відгукам. У Relomio також можна знайти вживані речі для нової оселі. Нижче я розповім про сервіс докладніше."
            founder_name:     "Олександр Варламов"
            founder_title:    "Засновник Relomio"
        calculator:
            title:            "Попередній розрахунок вартості переїзду"
            desc_html:        "Не можна недооцінювати важку фізичну працю вантажників і витрати на пальне під час перевезення ваших речей, тому сервіс дає перевізнику змогу вказати вартість відстані та перевезення окремих предметів різних категорій за кожен поверх угору чи вниз. <br> Переїзд — справа непроста й витратна. Калькулятор вартості перевезення дає клієнту змогу дізнатися приблизну вартість переїзду в компаніях, зареєстрованих у нашому сервісі. Без особистої участі неможливо врахувати всі нюанси, тому остаточну вартість переїзду узгоджують безпосередньо з перевізником."
        carriers:
            title:            "Реальні рейтинги та відгуки"
            desc_html:        "Можливість вибрати перевізника в регіоні на основі реальних відгуків про компанію, а також оцінити послуги перевізника на основі вашого досвіду."
        market:
            title:            "Можливість купувати й продавати вживані речі"
            desc_html:        "Будь-який зареєстрований користувач може подати оголошення про продаж вживаних речей, указавши регіон, стан і категорію товару. <br> Також можна купити вживані речі безпосередньо в перевізника, що дуже зручно: перевізники добре знаються на таких речах, а з ними можна одразу домовитися про доставку."
        moving_preparation:
            title:            "Підготовка до переїзду"
            desc_html:        "Якщо вам раніше не доводилося переїжджати в іншу квартиру або вам бракує досвіду в цій непростій справі, ознайомтеся з нашою статтею про підготовку до переїзду, щоб ретельніше спланувати його й почуватися впевненіше."
        statistics:
            title:            "Relomio у цифрах"
    